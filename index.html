 function message(msg, persist=false) {
   status.textContent=msg; status.style.display='block';
   clearTimeout(hideTimeout);
   if(!persist) hideTimeout=setTimeout(()=>{status.style.display='none'},5500);
 }
 let marker=null, accuracy=null, watchId=null, follow=true, lastPosition=null;
 const ctrl=L.control({position:'topleft'});
 ctrl.onAdd=function() {
   const wrap=L.DomUtil.create('div','gps-control leaflet-bar');
   const btn=L.DomUtil.create('button','gps-button',wrap);
   btn.type='button'; btn.title='Afficher et suivre ma position GPS';
   btn.setAttribute('aria-label','Afficher et suivre ma position GPS');
   btn.textContent='◎';
   L.DomEvent.disableClickPropagation(wrap);
   L.DomEvent.disableScrollPropagation(wrap);
   L.DomEvent.on(btn,'click',function(e){
     L.DomEvent.stop(e);
     follow=true;
     if(lastPosition) map.setView(lastPosition,Math.max(map.getZoom(),16));
     if(watchId===null) startGPS();
     else message('Suivi GPS actif. Position recentrée.');
   });
   ctrl.button=btn;
   return wrap;
 };
 ctrl.addTo(map);
 map.on('dragstart',()=>{follow=false;});
 function startGPS() {
   if(!navigator.geolocation) {message('Géolocalisation non disponible sur ce navigateur.',true);return;}
   if(!window.isSecureContext) {
     message('Pour activer le GPS sur iPhone, ouvre cette carte via une adresse HTTPS (pas directement comme fichier HTML).',true);
     return;
   }
   message('Recherche de ta position GPS…');
   watchId=navigator.geolocation.watchPosition(function(pos) {
     const latlng=[pos.coords.latitude,pos.coords.longitude];
     lastPosition=latlng;
     const radius=Math.max(0,pos.coords.accuracy||0);
     if(!marker) {
       marker=L.circleMarker(latlng,{radius:9,color:'#fff',weight:3,fillColor:'#1684ff',fillOpacity:1,interactive:false}).addTo(map);
       accuracy=L.circle(latlng,{radius,color:'#1684ff',weight:1,fillColor:'#1684ff',fillOpacity:.13,interactive:false}).addTo(map);
     } else {marker.setLatLng(latlng);accuracy.setLatLng(latlng).setRadius(radius);}
     if(follow) map.setView(latlng,Math.max(map.getZoom(),16),{animate:!!marker});
     ctrl.button.classList.add('active');
     status.style.display='none';
   },function(err) {
     const msgs={1:'Autorise la localisation dans les réglages de Safari pour voir ta position.',2:'Position GPS indisponible pour le moment.',3:'Le GPS met trop de temps à répondre. Réessaie.'};
     message(msgs[err.code]||'Impossible de récupérer la position GPS.',true);
     if(watchId!==null) {navigator.geolocation.clearWatch(watchId);watchId=null;}
   },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
 }
 // Ne demander l'autorisation qu'après une action explicite de l'utilisateur.
})();
</script>
</html>
